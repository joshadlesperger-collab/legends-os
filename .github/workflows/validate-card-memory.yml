name: Validate card checkpoint memory branch
on:
  push:
    branches:
      - feature/card-checkpoint-memory
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      - run: npm run typecheck
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      - run: node --experimental-strip-types --test tests/card-checkpoints.test.ts
      - run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
